<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="assets/Logo F.ico">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Valise | Redefinir Senha</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
    :root {
        --green-deep: #1a3a28;
        --green-mid: #2d5a3d;
        --gold: #c9973a;
        --gold-light: #e8c06a;
        --cream: #faf8f3;
        --white: #ffffff;
    }

    body, html {
        margin: 0; padding: 0; font-family: 'DM Sans', sans-serif;
        background: rgba(26, 58, 40, 0.97); color: var(--green-deep);
        min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }

    .login-box {
        background: var(--white); padding: 50px 40px; border-radius: 32px;
        width: 90%; max-width: 400px; text-align: center; box-shadow: 0 30px 60px rgba(0,0,0,0.4);
    }
    .login-logo { width: 250px; height: auto; margin-bottom: 10px; }
    .login-box h3 {
        font-family: 'Cormorant Garamond', serif; font-size: 1.8rem;
        margin: 10px 0 8px 0; color: var(--green-deep);
    }
    .login-box p.subtitle { font-size: 0.85rem; color: #777; margin: 0 0 20px 0; }
    .login-box input {
        width: 100%; padding: 18px; margin: 10px 0;
        border: 1px solid #eee; border-radius: 14px; box-sizing: border-box;
        background: #f9f9f9; font-size: 1rem; transition: 0.3s; text-align: center;
    }
    .login-box input:focus { border-color: var(--gold); outline: none; background: #fff; }
    #input-codigo { letter-spacing: 6px; font-weight: 700; font-size: 1.3rem; }
    .btn-access {
        width: 100%; background: var(--green-deep); color: var(--gold-light);
        padding: 18px; border: none; border-radius: 14px; font-weight: bold;
        cursor: pointer; margin-top: 20px; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s;
    }
    .btn-access:hover { background: #0e2016; letter-spacing: 2px; }
    .btn-access:disabled { opacity: 0.6; cursor: not-allowed; }
    #error { color:#d9534f; display:none; margin-top:15px; font-size:0.85rem; font-weight:bold; }
    #success-msg { color:#2d5a3d; display:none; margin-top:15px; font-size:0.85rem; font-weight:bold; }
    .voltar-link { display: inline-block; margin-top: 20px; color: #bbb; font-size: 0.85rem; text-decoration: underline; cursor: pointer; }
    .aviso-codigo { font-size: 0.78rem; color: #999; margin-top: -4px; margin-bottom: 10px; line-height: 1.4; }
</style>
</head>
<body>

<div class="login-box">
    <img src="assets/LogoM02.png?v=new" alt="Valise Logo" class="login-logo">

    <!-- Formulário principal: pede e-mail + código + nova senha.
         É o caminho padrão porque não depende de clique em link
         (evita o problema de scanners de e-mail "gastarem" o link). -->
    <div id="form-com-codigo">
        <h3>Redefinir senha</h3>
        <p class="subtitle">Digite o código que enviamos por e-mail e escolha sua nova senha.</p>

        <input type="email" id="input-email" placeholder="Seu e-mail">
        <input type="text" id="input-codigo" placeholder="Código recebido por e-mail" maxlength="12" inputmode="numeric">
        <p class="aviso-codigo">O código está no mesmo e-mail do link de redefinição, logo abaixo dele.</p>
        <input type="password" id="nova-senha-1" placeholder="Nova senha">
        <input type="password" id="confirma-senha-1" placeholder="Confirme a nova senha">

        <button class="btn-access" id="btn-salvar-codigo" onclick="salvarComCodigo()">Salvar nova senha</button>
    </div>

    <!-- Formulário simplificado: só aparece se o link em si já tiver
         funcionado e criado uma sessão de recuperação válida. -->
    <div id="form-so-senha" style="display:none;">
        <h3>Defina sua nova senha</h3>
        <p class="subtitle">Escolha uma senha com pelo menos 6 caracteres.</p>

        <input type="password" id="nova-senha-2" placeholder="Nova senha">
        <input type="password" id="confirma-senha-2" placeholder="Confirme a nova senha">

        <button class="btn-access" id="btn-salvar-sessao" onclick="salvarComSessao()">Salvar nova senha</button>
    </div>

    <p id="error"></p>
    <p id="success-msg"></p>

    <a href="index.html" class="voltar-link">Voltar ao início</a>
</div>

<script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL = "https://czwxsforuxlbwavlardu.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_EFPZAme1U4UkYemeSU4Kqg_E8eCp1oY";

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const formComCodigo = document.getElementById('form-com-codigo');
    const formSoSenha = document.getElementById('form-so-senha');
    const errorEl = document.getElementById('error');
    const successEl = document.getElementById('success-msg');

    // Se o link veio com o e-mail na URL (?email=...), já preenche o campo.
    const params = new URLSearchParams(window.location.search);
    const emailDaUrl = params.get('email');
    if (emailDaUrl) {
        document.getElementById('input-email').value = emailDaUrl;
    }

    // Se o link em si funcionar (o clique não foi "gasto" por um scanner de
    // e-mail), o Supabase dispara PASSWORD_RECOVERY com uma sessão válida —
    // nesse caso, pulamos o código e mostramos só o campo de senha.
    supabase.auth.onAuthStateChange((event, session) => {
        if (event === 'PASSWORD_RECOVERY') {
            formComCodigo.style.display = 'none';
            formSoSenha.style.display = 'block';
        }
    });

    function mostrarErro(msg) {
        errorEl.textContent = msg;
        errorEl.style.display = 'block';
        successEl.style.display = 'none';
    }

    function mostrarSucesso(msg) {
        successEl.textContent = msg;
        successEl.style.display = 'block';
        errorEl.style.display = 'none';
    }

    function validarSenhas(senha, confirma) {
        if (!senha || senha.length < 6) {
            mostrarErro('A senha precisa ter pelo menos 6 caracteres.');
            return false;
        }
        if (senha !== confirma) {
            mostrarErro('As senhas não coincidem.');
            return false;
        }
        return true;
    }

    // Caminho principal: verifica o código digitado e já troca a senha.
    window.salvarComCodigo = async function() {
        const email = document.getElementById('input-email').value.trim();
        const codigo = document.getElementById('input-codigo').value.trim();
        const senha = document.getElementById('nova-senha-1').value;
        const confirma = document.getElementById('confirma-senha-1').value;
        const btn = document.getElementById('btn-salvar-codigo');

        errorEl.style.display = 'none';
        successEl.style.display = 'none';

        if (!email) { mostrarErro('Digite seu e-mail.'); return; }
        if (!codigo) { mostrarErro('Digite o código recebido por e-mail.'); return; }
        if (!validarSenhas(senha, confirma)) return;

        const textoOriginal = btn.textContent;
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> VERIFICANDO...';

        // Verifica o código e, se válido, já ganha uma sessão de recuperação.
        const { error: erroOtp } = await supabase.auth.verifyOtp({
            email,
            token: codigo,
            type: 'recovery'
        });

        if (erroOtp) {
            btn.disabled = false;
            btn.textContent = textoOriginal;
            mostrarErro('Código inválido ou expirado: ' + erroOtp.message);
            return;
        }

        // Com a sessão válida, agora sim troca a senha.
        const { error: erroSenha } = await supabase.auth.updateUser({ password: senha });

        btn.disabled = false;
        btn.textContent = textoOriginal;

        if (erroSenha) {
            mostrarErro('Não foi possível salvar a senha: ' + erroSenha.message);
            return;
        }

        mostrarSucesso('Senha atualizada com sucesso! Redirecionando para o login...');
        setTimeout(() => { window.location.href = 'index.html'; }, 2000);
    }

    // Caminho alternativo: usado só quando o clique no link já criou sessão.
    window.salvarComSessao = async function() {
        const senha = document.getElementById('nova-senha-2').value;
        const confirma = document.getElementById('confirma-senha-2').value;
        const btn = document.getElementById('btn-salvar-sessao');

        errorEl.style.display = 'none';
        successEl.style.display = 'none';

        if (!validarSenhas(senha, confirma)) return;

        const textoOriginal = btn.textContent;
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> SALVANDO...';

        const { error } = await supabase.auth.updateUser({ password: senha });

        btn.disabled = false;
        btn.textContent = textoOriginal;

        if (error) {
            mostrarErro('Não foi possível salvar: ' + error.message);
            return;
        }

        mostrarSucesso('Senha atualizada com sucesso! Redirecionando para o login...');
        setTimeout(() => { window.location.href = 'index.html'; }, 2000);
    }
</script>

</body>
</html>
